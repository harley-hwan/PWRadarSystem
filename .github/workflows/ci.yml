# ==========================================================================
#  PWRadarSystem - continuous integration
#  ------------------------------------------------------------------------
#  This workflow exists to close a specific, real gap.  The PWR_OK collision
#  with <winuser.h> (see README section 1.1) compiled warning-free at -Werror,
#  broke only at run time, and left the Linux build completely unaffected.  A
#  Linux-only check would never have caught it.
#
#  So every push runs, in parallel:
#
#    linux         GCC, warnings-as-errors, numerical suite via CTest
#    windows-msvc  the real MSVC toolchain - the one thing that cannot be
#                  checked from Linux - plus the name-collision gate against
#                  the actual installed Windows SDK, and the self test EXECUTED
#    mingw-cross   the Win32 code path compiled from Linux, as a fast tripwire
#
#  Delete this file if you do not want CI; nothing else depends on it.
# ==========================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  #  Linux: the reference build.  Warnings are errors here because the
  #  GCC/Clang diagnostic set is verified clean.
  # ------------------------------------------------------------------------
  linux:
    name: Linux (GCC, -Werror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPWR_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Numerical acceptance suite
        run: ctest --test-dir build --output-on-failure

  # ------------------------------------------------------------------------
  #  Windows: MSVC.  This is the job that matters most - it is the only place
  #  the real toolchain and the real SDK headers are exercised.
  #
  #  PWR_WERROR stays OFF here on purpose.  MSVC /W4 diagnoses a partly
  #  different set from GCC and that set has not been triaged yet; a first
  #  build should fail on a defect, not on a diagnostic nobody has read.
  #  Turn it on once the warnings have been reviewed.
  # ------------------------------------------------------------------------
  windows-msvc:
    name: Windows (MSVC 2022)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Runs before the compiler: a name collision miscompiles silently, so
      # there is no point reading build output until this is clean.  Uses the
      # genuine Windows Kits headers on this runner, not a mingw approximation.
      - name: Name-collision gate (public headers vs Windows SDK)
        run: python tools/check_name_collisions.py

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      # Multi-config generators append the configuration name, so the binary
      # and the DLL land together in build/Release/.
      - name: Numerical acceptance suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: PWRadarSystem-windows-x64
          path: |
            build/Release/PWRadarUI.exe
            build/Release/PWRadarCore.dll
          if-no-files-found: error

  # ------------------------------------------------------------------------
  #  mingw-w64 cross build: compiles every line of the Win32 platform layer
  #  from Linux.  Cheaper than spinning up a Windows runner, so it fails fast
  #  on the common mistakes (missing header, wrong Win32 signature).
  # ------------------------------------------------------------------------
  mingw-cross:
    name: Win32 cross-compile (mingw-w64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cross-compile and gate
        run: |
          chmod +x tools/check_windows_build.sh
          ./tools/check_windows_build.sh
